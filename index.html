<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة المعرفة</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="ship" viewBox="0 0 100 100"><path d="M10 72h80l-14 16H24z" fill="#6b4426" stroke="#3a2412" stroke-width="3" stroke-linejoin="round"/><path d="M50 14v58" stroke="#3a2412" stroke-width="4"/><path d="M52 22c22 10 28 28 26 44H52z" fill="#fff6dc" stroke="#3a2412" stroke-width="3" stroke-linejoin="round"/><path d="M48 30c-16 8-22 22-20 36h20z" fill="#fff6dc" stroke="#3a2412" stroke-width="3" stroke-linejoin="round"/><path d="M50 12l18 6-18 6z" fill="#3f5fa8" stroke="#3a2412" stroke-width="2"/></symbol></svg>
<header class="topbar">

  <h1>جزر علوم اللغة</h1>

</nav>
<div id="panels"></div>

</html>
